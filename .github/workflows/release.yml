name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Verify Version Match
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag Version: $TAG"
          echo "Package Version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Git tag ($TAG) does not match package.json version ($PKG_VERSION)."
            echo "Please update the version in package.json to match the tag before releasing."
            exit 1
          fi

  generate-release-notes:
    name: Generate AI Release Notes (ant-actions)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate AI Release Notes with ant
        env:
          GEMINI_API_KEY: ${{ secrets.ANT_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")

          echo "Current Tag: $TAG_NAME"
          echo "Previous Tag: ${PREV_TAG:-<initial release>}"

          # Extract commit list
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges "${PREV_TAG}..${TAG_NAME}")
            DIFF_STAT=$(git diff --stat "${PREV_TAG}..${TAG_NAME}")
            RAW_DIFF=$(git diff "${PREV_TAG}..${TAG_NAME}")
          else
            COMMITS=$(git log --oneline --no-merges -n 50 "${TAG_NAME}")
            DIFF_STAT=$(git diff --stat "${TAG_NAME}~1..${TAG_NAME}" 2>/dev/null || echo "")
            RAW_DIFF=$(git diff "${TAG_NAME}~1..${TAG_NAME}" 2>/dev/null || echo "")
          fi

          # Truncate raw diff if too large (capped at ~35,000 characters)
          MAX_DIFF_CHARS=35000
          if [ ${#RAW_DIFF} -gt $MAX_DIFF_CHARS ]; then
            TRUNCATED_DIFF="${RAW_DIFF:0:$MAX_DIFF_CHARS}"
            DIFF_CONTENT="$TRUNCATED_DIFF"$'\n\n[... Note: Remaining diff truncated to prevent context overflow ...]'
          else
            DIFF_CONTENT="$RAW_DIFF"
          fi

          # Prepare instruction prompt for ant
          PROMPT_FILE=$(mktemp)
          cat << 'EOF' > "$PROMPT_FILE"
          You are an expert release engineer writing GitHub Release Notes for @amaranthic/greg-sdk.

          Your task: Analyze the provided git commits, diff stats, and code diff to produce authoritative, high-signal, developer-friendly Release Notes in GitHub Flavored Markdown.

          Structure and formatting guidelines:
          1. **Executive Summary**: 1–2 punchy sentences capturing the core theme, major milestones, or purpose of this release.
          2. **🚨 Breaking Changes (if applicable)**: Explicitly call out any breaking behavior or API changes. If none, omit this section entirely.
          3. **🚀 Highlights & New Features**: Categorize distinct capabilities added in this release. Explain why it matters to a developer.
          4. **🛠️ Bug Fixes & Improvements**: Bulleted list of stability, typing, or performance improvements.
          5. **📝 Commits**: Format the raw commit list cleanly under a collapsible `<details><summary>View full commit log</summary>...</details>` block.

          Tone & Rules:
          - Direct, polished, and developer-centric. Avoid corporate fluff or generic buzzwords.
          - Never repeat the same change across multiple categories.
          - Strictly output valid markdown. Do not prefix or suffix with meta-commentary like "Here are your release notes:".
          EOF

          CONTEXT_FILE=$(mktemp)
          cat << EOF > "$CONTEXT_FILE"
          Tag: $TAG_NAME
          Previous Tag: ${PREV_TAG:-None (Initial Release)}

          ### Commits:
          $COMMITS

          ### Diff Stat:
          $DIFF_STAT

          ### Diff (Truncated if large):
          $DIFF_CONTENT
          EOF

          AI_INPUT="$(cat $PROMPT_FILE)

          Context:
          $(cat $CONTEXT_FILE)"

          # Invoke ant-actions using google/gemini-flash-lite-latest with fallback
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Invoking ant-actions with google/gemini-flash-lite-latest to generate release notes..."
            if bun x ant-actions -p "$AI_INPUT" -m "google/gemini-flash-lite-latest" --output-format text --bare --no-session-persistence > release_notes.md 2>stderr.log; then
              echo "AI release notes generated successfully."
            else
              echo "Warning: ant-actions failed to generate release notes. Check stderr:"
              cat stderr.log
              echo "Falling back to git commit log..."
              {
                echo "## Release $TAG_NAME"
                echo ""
                echo "### Commits"
                echo "$COMMITS"
              } > release_notes.md
            fi
          else
            echo "ANT_API_KEY / GEMINI_API_KEY secret not found. Using fallback git release notes."
            {
              echo "## Release $TAG_NAME"
              echo ""
              echo "### Commits"
              echo "$COMMITS"
            } > release_notes.md
          fi

          rm -f "$PROMPT_FILE" "$CONTEXT_FILE" stderr.log

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  github-release:
    name: Publish GitHub Release
    needs: [verify, generate-release-notes]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm (Trusted Publishing / OIDC)
    needs: [verify, github-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      - name: Publish to npm via OIDC
        run: npm publish --provenance --access public
